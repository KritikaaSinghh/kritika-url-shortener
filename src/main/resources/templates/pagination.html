<nav th:if="${shortUrls.totalPages > 1}">
    <ul class="pagination justify-content-center">

        <!-- First Page -->
        <li class="page-item"
            th:classappend="${shortUrls.isFirst ? 'disabled' : ''}">

            <a class="page-link"
               th:href="@{${paginationUrl}(page=1)}"
               aria-label="First">

                <span aria-hidden="true">First</span>

            </a>
        </li>

        <!-- Previous Page -->
        <li class="page-item"
            th:classappend="${shortUrls.isFirst ? 'disabled' : ''}">

            <a class="page-link"
               th:href="@{${paginationUrl}(page=${shortUrls.pageNumber - 1})}"
               aria-label="Previous">

                <span aria-hidden="true">Previous</span>

            </a>
        </li>

        <!-- Current Page Information -->
        <li class="page-item disabled">

            <span class="page-link"
                  th:text="${'Page ' + shortUrls.pageNumber
                           + ' of '
                           + shortUrls.totalPages
                           + ' (Total: '
                           + shortUrls.totalElements
                           + ')'}">

                Page 1 of 10 (Total: 200)

            </span>

        </li>

        <!-- Next Page -->
        <li class="page-item"
            th:classappend="${shortUrls.isLast ? 'disabled' : ''}">

            <a class="page-link"
               th:href="@{${paginationUrl}(page=${shortUrls.pageNumber + 1})}"
               aria-label="Next">

                <span aria-hidden="true">Next</span>

            </a>
        </li>

        <!-- Last Page -->
        <li class="page-item"
            th:classappend="${shortUrls.isLast ? 'disabled' : ''}">

            <a class="page-link"
               th:href="@{${paginationUrl}(page=${shortUrls.totalPages})}"
               aria-label="Last">

                <span aria-hidden="true">Last</span>

            </a>
        </li>

    </ul>
</nav>
