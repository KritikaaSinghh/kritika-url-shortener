<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Kritika URL Shortener</title>
</head>

<body>

<div layout:fragment="content">

    <div class="row justify-content-center mt-5">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header">
                    <h4 class="card-title mb-0 text-center">
                        Create Account
                    </h4>
                </div>

                <div class="card-body">

                    <form th:action="@{/register}"
                          method="post"
                          th:object="${registerUserRequest}">

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="name"
                                   class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   th:field="*{name}"
                                   placeholder="Enter your full name">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email"
                                   class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   th:field="*{email}"
                                   placeholder="Enter your email">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password"
                                   class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   th:field="*{password}"
                                   placeholder="Enter password">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">
                            </div>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Register
                        </button>

                    </form>

                    <div class="mt-3 text-center">
                        Already have an account?
                        <a th:href="@{/login}">
                            Login
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
