<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My URLs</title>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const selectAllCheckbox = document.getElementById('selectAll');
            const urlCheckboxes = document.querySelectorAll('.url-checkbox');
            const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
            const deleteForm = document.getElementById('deleteForm');

            selectAllCheckbox.addEventListener('change', function () {
                const checked = this.checked;

                urlCheckboxes.forEach(cb => {
                    cb.checked = checked;
                });

                updateDeleteButton();
            });

            urlCheckboxes.forEach(cb => {
                cb.addEventListener('change', function () {
                    updateDeleteButton();

                    const allChecked =
                            Array.from(urlCheckboxes)
                                    .every(c => c.checked);

                    selectAllCheckbox.checked = allChecked;
                });
            });

            deleteSelectedBtn.addEventListener('click', function (e) {
                e.preventDefault();

                if (confirm(
                        'Are you sure you want to delete selected URLs?')) {
                    deleteForm.submit();
                }
            });

            function updateDeleteButton() {
                const anySelected =
                        Array.from(urlCheckboxes)
                                .some(cb => cb.checked);

                deleteSelectedBtn.disabled = !anySelected;
            }
        });
    </script>

</head>

<body>

<div layout:fragment="content">

    <h2 class="mt-5">My Shortened URLs</h2>

    <div th:if="${shortUrls.data.isEmpty()}"
         class="alert alert-info">
        You haven't created any short URLs yet.
    </div>

    <div th:unless="${shortUrls.data.isEmpty()}"
         class="table-responsive">

        <form id="deleteForm"
              th:action="@{/delete-urls}"
              method="post">

            <div class="mb-3">
                <button id="deleteSelectedBtn"
                        type="button"
                        class="btn btn-danger"
                        disabled>
                    Delete Selected
                </button>
            </div>

            <table class="table table-striped table-hover">

                <thead>
                <tr>
                    <th>
                        <input type="checkbox"
                               id="selectAll"
                               class="form-check-input">
                    </th>

                    <th>Short URL</th>
                    <th>Original URL</th>
                    <th>Created</th>
                    <th>Expires</th>
                    <th>Visibility</th>
                    <th>Clicks</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="url : ${shortUrls.data}">

                    <td>
                        <input type="checkbox"
                               name="ids"
                               th:value="${url.id}"
                               class="form-check-input url-checkbox">
                    </td>

                    <td>
                        <a th:href="@{/s/{key}(key=${url.shortKey})}"
                           th:text="${baseUrl + '/s/' + url.shortKey}"
                           target="_blank">
                        </a>
                    </td>

                    <td>
                        <a th:href="${url.originalUrl}"
                           th:text="${#strings.abbreviate(url.originalUrl,50)}"
                           target="_blank">
                        </a>
                    </td>

                    <td th:text="${#temporals.format(
                            url.createdAt,
                            'yyyy-MM-dd HH:mm')}">
                    </td>

                    <td th:text="${url.expiresAt != null ?
                            #temporals.format(
                            url.expiresAt,
                            'yyyy-MM-dd HH:mm')
                            : 'Never'}">
                    </td>

                    <td>
                        <span th:if="${url.isPrivate}"
                              class="badge bg-secondary">
                            Private
                        </span>

                        <span th:unless="${url.isPrivate}"
                              class="badge bg-success">
                            Public
                        </span>
                    </td>

                    <td th:text="${url.clickCount}">
                    </td>

                </tr>

                </tbody>

            </table>

        </form>

        <div th:insert="~{pagination}"></div>

    </div>

</div>

</body>
</html>
